configuration:
  address:
    name: Dirección Bluetooth de la cafetera
    description: >-
      Dirección MAC Bluetooth (BLE) de tu cafetera De'Longhi, p. ej. 00:A0:50:XX:XX:XX.
      Déjala vacía e inicia el addon para buscarla: las cafeteras encontradas aparecen en la pestaña Registro.
  log_level:
    name: Nivel de registro
    description: Cantidad de detalle que se escribe en el registro del addon.
