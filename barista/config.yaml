name: "Barista"
version: 0.2.0
slug: "barista"
description: "Control your De'Longhi ECAM coffee machine over Bluetooth with a Web UI and REST API."
url: https://github.com/asaf5767/barista
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: application
boot: auto
# Bluetooth goes through the host's BlueZ daemon over D-Bus
host_network: true
host_dbus: true
bluetooth: true
# Web UI inside Home Assistant (sidebar panel). barista always listens on 8080
# on the host network, which also keeps the REST API reachable for automations.
ingress: true
ingress_port: 8080
panel_icon: mdi:coffee
panel_title: Barista
options:
  address: ""
  log_level: info
schema:
  address: str?
  log_level: list(debug|info|warning|error)
