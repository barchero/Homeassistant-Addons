name: "Barista"
version: 0.1.0
slug: "barista"
description: "Control your De'Longhi ECAM coffee machine over Bluetooth with a Web UI and REST API."
url: https://github.com/asaf5767/barista
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: application
boot: auto
# Bluetooth goes through the host's BlueZ daemon over D-Bus
host_network: true
host_dbus: true
bluetooth: true
webui: "http://[HOST]:[PORT:8080]"
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Web UI / REST API (host network, change with the 'port' option)"
options:
  address: ""
  port: 8080
  log_level: info
schema:
  address: str?
  port: port
  log_level: list(debug|info|warning|error)
image: "ghcr.io/barchero/{arch}-addon-barista"
